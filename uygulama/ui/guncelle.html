<!doctype html>
<html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nahrok: güncelleme gerekli</title><link rel="stylesheet" href="ortak.css">
<main class="kart">
  <div class="simge" aria-hidden="true">N</div>
  <h1>Nahrok'un yeni sürümü gerekli</h1>
  <p>Bu sürüm artık sunucuyla çalışmıyor. Microsoft Store'dan güncelleyip uygulamayı yeniden aç.</p>
  <a class="dugme" id="store" href="ms-windows-store://downloadsandupdates">Microsoft Store'da güncelle</a>
  <small id="surum"></small>
</main>
<script>
  const q = new URLSearchParams(location.search);
  const store = q.get('store') || '';
  if (store.startsWith('ms-windows-store://')) document.getElementById('store').href = store;
  const surum = (q.get('surum') || '').replace(/[^0-9.]/g, '');
  if (surum) document.getElementById('surum').textContent = 'Yüklü sürüm: ' + surum;
</script>
</html>
