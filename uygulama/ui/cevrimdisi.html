<!doctype html>
<html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nahrok: bağlanılamadı</title><link rel="stylesheet" href="ortak.css">
<main class="kart">
  <div class="simge" aria-hidden="true">N</div>
  <h1>Nahrok'a bağlanılamadı</h1>
  <p>İnternet bağlantını kontrol et. Bağlantı gelince kendiliğinden yeniden denenecek.</p>
  <button id="dene" type="button">Tekrar dene</button>
  <small id="durum" aria-live="polite"></small>
</main>
<script>
  // Site adresi uygulamadan gelir; yalnız https kabul edilir (uygulama başka adrese gezinmeye zaten izin vermez)
  const p = new URLSearchParams(location.search).get('site') || '';
  const site = /^https?:\/\//.test(p) ? p : 'https://ekorhan.site/';
  const dene = () => { document.getElementById('durum').textContent = 'Deneniyor…'; location.href = site; };
  document.getElementById('dene').addEventListener('click', dene);
  window.addEventListener('online', dene);
  setTimeout(dene, 15000);
</script>
</html>
