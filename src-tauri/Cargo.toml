[package]
name = "nahrok"
version = "1.1.0"
description = "Nahrok masaüstü: canlı siteyi yükleyen Windows uygulaması"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
webview2-com = "0.39"
windows = { version = "0.62", features = ["ApplicationModel", "ApplicationModel_Activation"] }
windows-core = "0.62"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
